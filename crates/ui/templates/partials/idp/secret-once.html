{#- A generated client secret, shown exactly once. Needs `cid` and `secret` in scope. -#}
<section class="notice notice--warn idp-secret" role="alert">
  <p><strong>{{ i18n.t_arg("idpc-secret-once-title", "client", cid.clone()) }}</strong></p>
  <p>{{ i18n.t("idpc-secret-once-detail") }}</p>
  {% call ui::copy_field(secret, i18n.t("idpc-copy-secret")) %}{% endcall %}
</section>
