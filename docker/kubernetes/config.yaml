apiVersion: v1
kind: ConfigMap
metadata:
  name: hfs-config
data:
  HFS_STORAGE_BACKEND: postgres
  HFS_PG_MAX_CONNECTIONS: "32"
  HFS_PG_STATEMENT_TIMEOUT_MS: "60000"
  HFS_PG_POOL_WAIT_TIMEOUT_SECS: "10"
  HFS_PG_CONNECT_TIMEOUT_SECS: "10"
  HFS_BASE_URL: https://fhir.hospital.example/fhir
  HFS_DEFAULT_FHIR_VERSION: R4
  HFS_PACKAGE_CACHE_DIR: /data/packages
  HFS_BULK_EXPORT_OUTPUT_DIR: /data/export
  HFS_TERMINOLOGY_SERVER: http://hts:8090
  HFS_TERMINOLOGY_TIMEOUT_SECS: "30"
  HFS_VALIDATION_MODE: "off"
  HFS_VALIDATION_STORED_PROFILES: "true"
  HFS_VALIDATION_TERMINOLOGY: embedded
  HFS_ADMIN_UI: "true"
  HFS_ADMIN_COOKIE_SECURE: "true"
  HFS_ADMIN_TRUSTED_PROXIES: 10.0.0.0/8
  HFS_MAX_BODY_SIZE: "268435456"
  HFS_REQUEST_TIMEOUT: "600"
  HFS_LOG_LEVEL: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hts-config
data:
  HTS_STORAGE_BACKEND: postgres
  HTS_PG_POOL_SIZE: "16"
  HTS_PG_POOL_WAIT_TIMEOUT_SECS: "60"
  HTS_PG_CONNECT_TIMEOUT_SECS: "10"
  HFS_PG_MAX_CONNECTIONS: "8"
  HTS_REQUEST_TIMEOUT: "600"
  HTS_MAX_BODY_SIZE: "268435456"
  HTS_ADMIN_DATA_DIR: /data/hts-admin
  HTS_ADMIN_UI: "true"
  HTS_ADMIN_COOKIE_SECURE: "true"
  HTS_ADMIN_TRUSTED_PROXIES: 10.0.0.0/8
  HTS_IMPORT_DIR: /import
  HTS_LOG_LEVEL: info
