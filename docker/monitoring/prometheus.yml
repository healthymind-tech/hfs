# Prometheus scrape configuration for an HFS + HTS + PostgreSQL deployment.
# Used by docker/production/docker-compose.yml (profile "monitoring"); for an
# existing Prometheus, copy the scrape_configs and rule_files entries.
#
# /metrics on hfs and hts is unauthenticated by design (no tenant labels).
# Scrape it on the internal network; do not expose it through the public
# reverse proxy (docs/ops/monitoring.md).
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    deployment: hfs-production   # change per site / environment

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []            # e.g. ["alertmanager:9093"]

scrape_configs:
  - job_name: hfs
    metrics_path: /metrics
    static_configs:
      - targets: ["hfs:8080"]
  - job_name: hts
    metrics_path: /metrics
    static_configs:
      - targets: ["hts:8090"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  # Host metrics and the backup freshness textfile (scripts/ops/pg-backup.sh
  # writes hfs_backup_* when PROM_TEXTFILE_DIR is set).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
