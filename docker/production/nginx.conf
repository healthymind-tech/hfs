# Reverse proxy for docker/production/docker-compose.yml. Derived from the
# evaluation stack's nginx (hfs-eval/nginx/nginx.conf) with production changes:
#   * /metrics and /fhir/metrics, /tx/metrics are NOT proxied (Prometheus
#     scrapes hfs:8080 / hts:8090 on the internal network)
#   * per-client request rate limiting on the FHIR API (until SMART/OIDC lands
#     REST writes are unauthenticated: keep this host on the hospital network)
#   * access log with request time and upstream time for latency forensics
#   * replace PUBLIC_HOST below with the public name (e.g. fhir.hospital.example)
# TLS is terminated by the edge proxy / load balancer in front of this nginx;
# if nginx terminates TLS itself, add a `listen 443 ssl` server with the site
# certificate and HSTS.
log_format hfs_timed '$remote_addr - [$time_iso8601] "$request" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time ua="$http_user_agent"';
limit_req_zone $binary_remote_addr zone=fhir_api:20m rate=50r/s;

server {
    listen 80;
    server_name _;
    set $public_host PUBLIC_HOST;
    absolute_redirect off;
    access_log /var/log/nginx/access.log hfs_timed;

    client_max_body_size 256m;          # = HFS_MAX_BODY_SIZE
    proxy_read_timeout 600;             # = HFS_REQUEST_TIMEOUT
    proxy_send_timeout 600;
    proxy_connect_timeout 30;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Prometheus endpoints stay internal.
    location ~ ^/(fhir/|tx/)?metrics$ { return 404; }

    location / {
        limit_req zone=fhir_api burst=200 nodelay;
        proxy_pass http://hfs:8080;
    }
    location = /fhir { limit_req zone=fhir_api burst=200 nodelay; proxy_pass http://hfs:8080/; }
    location /fhir/ {
        limit_req zone=fhir_api burst=200 nodelay;
        proxy_pass http://hfs:8080/;
    }

    location = /tx {
        proxy_pass http://hts:8090/;
        proxy_set_header Host $public_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /tx/ {
        proxy_pass http://hts:8090/;
        proxy_set_header Host $public_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/fhir+json application/json;
        sub_filter_once off;
        sub_filter 'https://$public_host/' 'https://$public_host/tx/';
    }

    location /ui/hts { proxy_pass http://hts:8090; }
    location /ui     { proxy_pass http://hfs:8080; }
}
